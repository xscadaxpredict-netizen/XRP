{% extends "base.html" %}
{% block content %}
  <!-- Display Django messages -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
<h2>Rate Vendor: {{ vendor.name }}</h2>

<form method="post" action="{% url 'vendor_rate' vendor.id %}">
  {% csrf_token %}

  <div id="star-rating" style="font-size: 2em; cursor: pointer;">
    {% for i in "12345" %}
      <span class="star" data-value="{{ forloop.counter }}">&#9734;</span>
    {% endfor %}
  </div>
  <input type="hidden" name="rating" id="rating-input" value="0" required />

  <br><br>

  <label for="comments">Comments (optional):</label><br>
  <textarea name="comments" id="comments" rows="4" cols="40"></textarea><br><br>

  <button type="submit" class="btn btn-primary">Submit Rating</button>
</form>

<a href="{% url 'vendor_list' %}">Back to Vendors</a>

<script>
  const stars = document.querySelectorAll('#star-rating .star');
  const ratingInput = document.getElementById('rating-input');

  stars.forEach(star => {
    star.addEventListener('click', function() {
      const rating = this.getAttribute('data-value');
      ratingInput.value = rating;
      stars.forEach(s => {
        s.innerHTML = (s.getAttribute('data-value') <= rating) ? '★' : '☆';
      });
    });
  });
</script>
{% endblock %}
