<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>XpredictLabs - Client Portal</title>
    <link rel="icon" href="{% static 'xtitle.jpeg' %}" type="image/x-icon">
    
    <!-- CSS files -->
    <link href="{% static 'css/tabler.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        @import url('https://rsms.me/inter/inter.css');
        :root {
            --tblr-font-sans-serif: 'Inter Var', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
        }
        body {
            font-feature-settings: "cv03", "cv04", "cv11";
            background-color: #f8fafc;
        }
    </style>
    
    {% block includecss %}{% endblock %}
</head>
<body class="d-flex flex-column">
    <div class="page">
        <!-- Client Header Navbar -->
        <header class="navbar navbar-expand-md navbar-light bg-white d-print-none" style="box-shadow: 0 4px 20px rgba(0,0,0,0.03); border-bottom: 1px solid #f1f5f9;">
            <div class="container-xl d-flex justify-content-between align-items-center py-1">
                <h1 class="navbar-brand navbar-brand-autodark pe-0 pe-md-3">
                    <img src="{% static 'xlogo.png' %}" alt="XpredictLabs" height="40" class="me-2 rounded">
                </h1>
                <span class="badge bg-primary-lt text-primary px-3 py-2 fw-bold rounded-pill" style="border: 1px solid rgba(var(--tblr-primary-rgb), 0.2); font-size: 0.85rem;">Client Portal</span>
            </div>
        </header>

        <div class="page-wrapper pt-3">
            {% block content %}{% endblock %}
        </div>
        
        <footer class="footer footer-transparent d-print-none mt-auto py-3">
            <div class="container-xl text-center text-muted small">
                &copy; {% now "Y" %} XpredictLabs. All rights reserved.
            </div>
        </footer>
    </div>
    
    <!-- Core JS files -->
    <script src="{% static 'js/tabler.min.js' %}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
