{% load static %}
<div class="sticky-top">
    <!-- Top Navbar -->
    <header class="navbar navbar-expand-md d-print-none bg-white border-bottom">
        <div class="container-xl">
            <!-- Toggler -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu"
                aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Brand -->
            <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                <a href="{% url 'landing_page' %}"
                    class="d-flex align-items-center gap-2 text-decoration-none text-dark">
                    <img src="{% static 'gstbillingapp/images/xlogo.jpeg' %}" alt="Xpredicts Labs Logo"
                        style="height: 32px; width: auto; object-fit: contain;">

                </a>
            </h1>

            <div class="navbar-nav flex-row order-md-last align-items-center gap-3">
                {% if user.is_authenticated %}
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown"
                        aria-label="Open user menu">
                        <div class="d-none d-xl-block pe-2 text-end">
                            <div class="fw-semibold">{{ user.username }}</div>
                        </div>
                        <span class="avatar avatar-sm bg-primary-lt rounded-circle">
                            <i class="ti ti-user"></i>
                        </span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                        <a href="{% url 'user_profile' %}" class="dropdown-item">
                            <i class="ti ti-id-badge me-2"></i> My Profile
                        </a>
                        <a href="{% url 'signup_view' %}" class="dropdown-item">
                            <i class="ti ti-user-plus me-2"></i> New Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="ti ti-logout me-2"></i> Logout
                            </button>
                        </form>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Bottom Navbar (Menu) -->
    <header class="navbar-expand-md">
        <div class="collapse navbar-collapse" id="navbar-menu">
            <div class="navbar bg-white border-bottom shadow-sm">
                <div class="container-xl">
                    {% if user.is_authenticated %}
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'invoice_create' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                                        class="ti ti-file-plus"></i></span>
                                <span class="nav-link-title">New Invoice</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'invoices' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                                        class="ti ti-files"></i></span>
                                <span class="nav-link-title">Invoices</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'credit_note_create' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                                        class="ti ti-receipt-refund"></i></span>
                                <span class="nav-link-title">New Credit Note</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'credit_notes' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                                        class="ti ti-receipt"></i></span>
                                <span class="nav-link-title">Credit Notes</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'customers' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                                        class="ti ti-users"></i></span>
                                <span class="nav-link-title">Customers</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'products' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-box"></i></span>
                                <span class="nav-link-title">Products</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'displaybanks' %}">
                                <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                                        class="ti ti-building-bank"></i></span>
                                <span class="nav-link-title">Banks</span>
                            </a>
                        </li>
                    </ul>
                    {% endif %}
                </div>
            </div>
        </div>
    </header>
</div>
