{% extends 'base.html' %}
{% block content %}

<div class="container py-5 px-4" style="max-width: 800px; min-height: 100vh;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-5 pb-4 border-bottom border-secondary-subtle">
        <div>
            <h1 class="fw-bold text-dark mb-1">Edit Dealership</h1>
            <p class="text-muted mb-0">Modify configuration and assigned members for '{{ dealership.name }}'.</p>
        </div>
        <a href="{% url 'manage_dealerships' %}" class="btn btn-outline-secondary px-4 rounded-pill">
            <i class="bi bi-x-circle me-1"></i> Cancel
        </a>
    </div>

    <!-- Edit Form Card -->
    <div class="card border-0 shadow-lg" style="border-radius: 16px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
        <div class="card-body p-5">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="name" class="form-label fw-bold text-dark">Dealership Name</label>
                    <input type="text" class="form-control form-control-lg rounded-3" id="name" name="name" value="{{ dealership.name }}" required>
                </div>

                <div class="row mb-4">
                    <div class="col-6">
                        <label for="start_date" class="form-label fw-bold text-dark">Start Date</label>
                        <input type="date" class="form-control rounded-3" id="start_date" name="start_date" 
                               value="{% if dealership.start_date %}{{ dealership.start_date|date:'Y-m-d' }}{% endif %}">
                    </div>
                    <div class="col-6">
                        <label for="end_date" class="form-label fw-bold text-dark">End Date</label>
                        <input type="date" class="form-control rounded-3" id="end_date" name="end_date" 
                               value="{% if dealership.end_date %}{{ dealership.end_date|date:'Y-m-d' }}{% endif %}">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-6">
                        <label for="target_orders" class="form-label fw-bold text-dark">Target Orders</label>
                        <input type="number" class="form-control rounded-3" id="target_orders" name="target_orders" 
                               min="0" value="{{ dealership.target_orders }}" required>
                    </div>
                    <div class="col-6">
                        <label for="target_revenue" class="form-label fw-bold text-dark">Target Revenue (₹)</label>
                        <input type="number" step="0.01" class="form-control rounded-3" id="target_revenue" name="target_revenue" 
                               min="0.00" value="{{ dealership.target_revenue }}" required>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="members" class="form-label fw-bold text-dark">Assign Members (Select Multiple)</label>
                    <select multiple class="form-select rounded-3" id="members" name="members" style="height: 200px;">
                        {% for user in all_users %}
                            <option value="{{ user.id }}" {% if user in current_members %}selected{% endif %}>
                                {{ user.username }} ({{ user.email }})
                            </option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Hold Control/Cmd to select/deselect multiple members.</small>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-primary px-5 py-3 rounded-pill fw-bold flex-fill">
                        <i class="bi bi-save me-1"></i> Save Changes
                    </button>
                    <a href="{% url 'manage_dealerships' %}" class="btn btn-outline-secondary px-5 py-3 rounded-pill fw-bold">
                        Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
