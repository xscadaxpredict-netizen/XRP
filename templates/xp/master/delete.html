{% extends 'base.html' %}
{% block content %}
<div class="page-header d-print-none mb-4">
    <div class="container-xl">
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-pretitle">
                    <a href="{% url 'master_dashboard' %}" class="text-decoration-none">Master Settings</a> / 
                    <a href="{% url 'master_list' info.app_label info.model_name %}" class="text-decoration-none">{{ info.name }}</a> / Delete
                </div>
                <h2 class="page-title"><i class="bi bi-trash-fill me-2 text-danger"></i> Delete {{ info.name|slice:":-1" }}</h2>
            </div>
        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">
        <div class="card shadow-sm border-0" style="border-radius: 12px; max-width: 600px; margin: 0 auto;">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <div class="avatar avatar-xl bg-danger-lt text-danger rounded-circle mb-3 mx-auto shadow-sm" style="width: 80px; height: 80px;">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                    </div>
                    <h3 class="fw-bold fs-2 text-dark">Are you sure?</h3>
                    <p class="text-muted fs-4">You are about to permanently delete the {{ info.name|slice:":-1"|lower }} <strong>"{{ obj }}"</strong>. This action cannot be undone.</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'master_list' info.app_label info.model_name %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 shadow-sm">Yes, Delete It</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
