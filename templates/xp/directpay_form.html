{% extends 'base.html' %}

{% block content %}

<!-- Include Bootstrap Icons CDN to guarantee icons load -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  .dashboard-transition-container {
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dashboard-transition-container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .dashboard-transition-container.fade-out {
    opacity: 0;
    transform: translateY(-15px);
  }
  
  .required {
    color: #dc3545;
    font-weight: bold;
    margin-left: 2px;
  }
</style>

<div class="container-fluid py-5 px-4 dashboard-transition-container" id="dashboard-container" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh;">
  <!-- Back Link -->
  <div class="mb-3">
    <a href="{% url 'directpay_preview' %}" class="text-decoration-none text-muted small transition-link">
      <i class="bi bi-arrow-left me-1"></i> Back to Direct Pay List
    </a>
  </div>

  <!-- Page Header -->
  <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
    <h1 class="h2 fw-bold text-dark mb-0">Direct Pay</h1>
    <div class="bg-white border rounded-3 px-3 py-2 shadow-sm fs-6 text-muted">
      <strong class="text-dark"><i class="bi bi-calendar3 me-1"></i>Date:</strong> {{ current_date }}
    </div>
  </div>

  <!-- Main card with modern styling matching newitemform -->
  <div class="card border-0 shadow-lg" style="border-radius: 16px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
        <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
          <h3 class="fw-bold text-dark mb-0"><i class="bi bi-wallet2 text-primary me-2"></i>Direct Pay Information</h3>
        </div>
        
        <div class="card-body p-4">
          <form id="directPayForm" action="{% url 'directpay_form' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
        
            <div class="row g-4">
              <!-- Left Column -->
              <div class="col-md-6 col-12">
                <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
                  <i class="bi bi-file-earmark-text text-primary me-2"></i>Payment Details
                </h5>
                
                <!-- Item Type -->
                <div class="mb-3">
                  <label for="item_type" class="form-label fw-semibold text-dark"><span class="required">*</span> Select an item type</label>
                  <select class="form-select rounded-3 shadow-sm" name="item_type" id="item_type" required>
                    <option value="" {% if not submitted_data %}selected{% endif %} disabled>Select Item Type</option>
                    <option value="fright_transportation" {% if submitted_data and submitted_data.item_type == 'fright_transportation' %}selected{% endif %}>Fright/Transportation</option>
                    <option value="food_grocery" {% if submitted_data and submitted_data.item_type == 'food_grocery' %}selected{% endif %}>Food/Grocery</option>
                    <option value="fuel_oil" {% if submitted_data and submitted_data.item_type == 'fuel_oil' %}selected{% endif %}>Fuel and Oil</option>
                    <option value="others" {% if submitted_data and submitted_data.item_type == 'others' %}selected{% endif %}>Others</option>
                    <option value="vendor" {% if submitted_data and submitted_data.item_type == 'vendor' %}selected{% endif %}>Vendor</option>
                    <option value="reimbursement" {% if submitted_data and submitted_data.item_type == 'reimbursement' %}selected{% endif %}>Reimbursement</option>
                    <option value="site_services" {% if submitted_data and submitted_data.item_type == 'site_services' %}selected{% endif %}>Site Services</option>
                    <option value="advances" {% if submitted_data and submitted_data.item_type == 'advances' %}selected{% endif %}>Advances</option>
                    <option value="travelling" {% if submitted_data and submitted_data.item_type == 'travelling' %}selected{% endif %}>Travelling</option>
                    <option value="electricity_bill" {% if submitted_data and submitted_data.item_type == 'electricity_bill' %}selected{% endif %}>Electricity Bill</option>
                    <option value="internet_bill" {% if submitted_data and submitted_data.item_type == 'internet_bill' %}selected{% endif %}>Internet Bill</option>
                    <option value="postage_telegram" {% if submitted_data and submitted_data.item_type == 'postage_telegram' %}selected{% endif %}>Postage and Telegram</option>
                    <option value="machine_repair" {% if submitted_data and submitted_data.item_type == 'machine_repair' %}selected{% endif %}>Machine Repair and Maintenance - Machinery</option>
                    <option value="conveyance" {% if submitted_data and submitted_data.item_type == 'conveyance' %}selected{% endif %}>Conveyance</option>
                    <option value="stationary_printing" {% if submitted_data and submitted_data.item_type == 'stationary_printing' %}selected{% endif %}>Stationary and Printing</option>
                    <option value="hospitality" {% if submitted_data and submitted_data.item_type == 'hospitality' %}selected{% endif %}>Hospitality</option>
                    <option value="Medicine" {% if submitted_data and submitted_data.item_type == 'medicine' %}selected{% endif %}>Medicine</option>
                  </select>
                </div>
            
                <!-- Item Name -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> Item Name / Remarks</label>
                  <input type="text" class="form-control rounded-3 shadow-sm" name="item_name" placeholder="Enter item name" required>
                </div>
            
                <!-- Payment Category -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark" for="selectOption">Payment Category</label>
                  <select class="form-select rounded-3 shadow-sm" id="selectOption" name="transaction_option" onchange="updateFormFields()" required>
                    <option value="" {% if not submitted_data %}disabled{% endif %} selected>Select an option</option>
                    <option value="bill" {% if submitted_data and submitted_data.transaction_option == 'bill' %}selected{% endif %}>Bill</option>
                    <option value="voucher" {% if submitted_data and submitted_data.transaction_option == 'voucher' %}selected{% endif %}>Voucher</option>
                    <option value="gst" {% if submitted_data and submitted_data.transaction_option == 'gst' %}selected{% endif %}>GST</option>
                  </select>
                </div>
                
                <!-- Bill Upload -->
                <div class="mb-3" id="billUpload" style="display:none;">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> Upload Bill</label>
                  <input type="file" class="form-control rounded-3 shadow-sm" name="bill_photo">
                </div>
            
                <!-- GST Upload -->
                <div class="mb-3" id="gstUpload" style="display:none;">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> Upload GST</label>
                  <input type="file" class="form-control rounded-3 shadow-sm" name="gst_photo">
                </div>
              </div>
            
              <!-- Right Column -->
              <div class="col-md-6 col-12">
                <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
                  <i class="bi bi-gear text-primary me-2"></i>Transaction Settings
                </h5>

                <!-- Transaction Category -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> Transaction Category</label>
                  <select class="form-select rounded-3 shadow-sm" name="transaction_category" required>
                    <option value="external">External</option>
                  </select>
                </div>
            
                <!-- External Name -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> External Name</label>
                  <input type="text" class="form-control rounded-3 shadow-sm" name="external_name" value="TPA" placeholder="Enter external name" required>
                </div>
            
                <!-- Total Amount -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> Total Amount (₹)</label>
                  <input type="number" step="0.01" min="0" class="form-control rounded-3 shadow-sm" name="total_amount" placeholder="Enter Amount" required>
                </div>
            
                <!-- Payment Mode -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark" for="paymentMode"><span class="required">*</span> Payment Mode</label>
                  <select class="form-select rounded-3 shadow-sm" id="paymentMode" name="payment_mode" required>
                    <option value="" {% if not submitted_data %}disabled{% endif %} selected>Select Payment Mode</option>
                    <option value="cash" {% if submitted_data and submitted_data.payment_mode == 'cash' %}selected{% endif %}>Cash</option>
                    <option value="upi" {% if submitted_data and submitted_data.payment_mode == 'upi' %}selected{% endif %}>UPI</option>
                    <option value="net_banking" {% if submitted_data and submitted_data.payment_mode == 'net_banking' %}selected{% endif %}>Net Banking</option>
                    <option value="credit" {% if submitted_data and submitted_data.payment_mode == 'credit' %}selected{% endif %}>Credit</option>
                    <option value="debit" {% if submitted_data and submitted_data.payment_mode == 'debit' %}selected{% endif %}>Debit</option>
                  </select>
                </div>
            
                <!-- Proof Photo -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark">
                    <span class="required">*</span> Upload Proof Photo
                    <small class="text-muted d-block" style="font-size: 11px;">(Mandatory except Cash Voucher & Conveyance)</small>
                  </label>
                  <input type="file" class="form-control rounded-3 shadow-sm" name="proof_photo" required>
                </div>
            
                <!-- Transaction Date -->
                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark"><span class="required">*</span> Transaction Date</label>
                  <input type="date" class="form-control rounded-3 shadow-sm" name="transaction_date" required>
                </div>
              </div>
            </div>
        
            <!-- Actions -->
            <div class="mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
              <button type="reset" class="btn btn-outline-secondary rounded-pill px-4 py-2">Reset</button>
              <button type="submit" class="btn btn-primary rounded-pill px-4 py-2" style="background: #003366; border: none;"><i class="bi bi-save me-1"></i> Submit</button>
            </div>
          </form>
        </div>
      </div>
</div>

<script>
  // Smooth Page Transition
  document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("dashboard-container");
    if (container) {
      requestAnimationFrame(() => {
        container.classList.add("visible");
      });
    }
  });

  function updateFormFields() {
    const selected = document.getElementById("selectOption").value;
  
    // Hide all by default
    document.getElementById("billUpload").style.display = "none";
    document.getElementById("gstUpload").style.display = "none";
  
    // Show based on selection
    if (selected === "bill") {
      document.getElementById("billUpload").style.display = "block";
    } else if (selected === "gst") {
      document.getElementById("gstUpload").style.display = "block";
    }
  }
  
  // Disable future dates in Transaction Date field
  document.addEventListener("DOMContentLoaded", function() {
    const dateInput = document.querySelector('input[name="transaction_date"]');
    if (dateInput) {
      const today = new Date().toISOString().split("T")[0];
      dateInput.setAttribute("max", today);
    }
  });
</script>
{% endblock content %}
