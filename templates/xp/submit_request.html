{% extends 'base.html' %}
{% block content %}

<!-- Include Bootstrap Icons CDN to guarantee icons load -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  .dashboard-transition-container {
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dashboard-transition-container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .dashboard-transition-container.fade-out {
    opacity: 0;
    transform: translateY(-15px);
  }
</style>

<div class="container-fluid py-5 px-4 dashboard-transition-container" id="dashboard-container" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh;">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      
      <!-- Back Link -->
      <div class="mb-3">
        <a href="{% url 'view_requests' %}" class="text-decoration-none text-muted small transition-link">
          <i class="bi bi-arrow-left me-1"></i> Back to Requests
        </a>
      </div>

      <!-- Main card with modern styling -->
      <div class="card border-0 shadow-lg" style="border-radius: 16px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); overflow: hidden;">
        <div class="card-header bg-primary text-white p-4 border-0" style="background: linear-gradient(135deg, #003366 0%, #001f3f 100%);">
          <h3 class="h4 fw-bold mb-0 text-white"><i class="bi bi-chat-square-text me-2"></i>Raise Ticket / Submit Request</h3>
          <p class="mb-0 text-white-50 small mt-1">Submit your request or concern and our staff will reply shortly.</p>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
              <label for="messageText" class="form-label fw-semibold text-secondary">Describe your request in detail:</label>
              <textarea 
                id="messageText"
                name="message" 
                class="form-control rounded-3" 
                rows="6" 
                placeholder="Type here..." 
                required 
                style="border: 1px solid #ced4da; padding: 12px; font-size: 15px;"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-semibold shadow-sm" style="background: #003366; border: none;">
              <i class="bi bi-send me-1"></i> Submit Request
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Smooth Page Transition
  document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("dashboard-container");
    if (container) {
      requestAnimationFrame(() => {
        container.classList.add("visible");
      });
    }
  });
</script>
{% endblock %}
